version: "3"

services:

  backend:
    build:
      context: backend
      dockerfile: backend.Dockerfile
    image: joptim-backend
    restart: always
    depends_on:
      - db
    entrypoint:
      [
        "bash",
        "-c",
        "alembic upgrade head && uvicorn main:app --proxy-headers --host 0.0.0.0 --env-file .env --port 8000 --root-path /joptim-api --workers 4",
      ]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.joptim-backend.rule=PathPrefix(`/joptim-api`)"
      - "traefik.http.services.joptim-backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.joptim-backend.entrypoints=websecure"
      - "traefik.http.routers.joptim-backend.tls=true"
      - "traefik.http.middlewares.strip_joptim.stripprefix.prefixes=/joptim-api"
      - "traefik.http.routers.joptim-backend.middlewares=strip_joptim@docker"
      - "traefik.docker.network=traefik-network"
    networks:
      - traefik-network
      - database

  backend-ws:
    build:
      context: backend-ws
      dockerfile: backend-ws.Dockerfile
    image: joptim-backend-ws
    restart: always
    depends_on:
      - db
    entrypoint:
      [
        "bash",
        "-c",
        "uvicorn main:app --proxy-headers --host 0.0.0.0 --env-file .env --port 8001 --root-path /joptim-ws --workers 4",
      ]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.joptim-backend-ws.rule=PathPrefix(`/joptim-ws`)"
      - "traefik.http.services.joptim-backend-ws.loadbalancer.server.port=8001"
      - "traefik.http.routers.joptim-backend-ws.entrypoints=web,websecure"
      - "traefik.http.routers.joptim-backend-ws.tls=true"
      - "traefik.http.middlewares.strip_joptim-ws.stripprefix.prefixes=/joptim-ws"
      - "traefik.http.routers.joptim-backend-ws.middlewares=strip_joptim-ws@docker"
      - "traefik.docker.network=traefik-network"
    networks:
      - traefik-network
      - database

  frontend:
    build:
      context: frontend
      dockerfile: frontend.Dockerfile
    image: joptim-frontend
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.joptim.rule=PathPrefix(`/joptim`)"
      - "traefik.http.services.joptim.loadbalancer.server.port=3000"
      - "traefik.http.routers.joptim.entrypoints=websecure"
      - "traefik.http.routers.joptim.tls=true"
    networks:
      - traefik-network

  db:
    build:
      context: database
      dockerfile: db.Dockerfile
    image: joptim-db
    restart: always
    volumes:
      - ./database/db:/var/lib/postgresql/data
    networks:
      - database

networks:
  traefik-network:
    external: true
  database:
    driver: bridge

volumes:
  db:
