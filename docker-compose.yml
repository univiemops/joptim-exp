version: "3.7"

services:
  nginx:
    image: nginx:1.23.2-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./cert.pem:/root/ssl/cert.pem
      - ./key.pem:/root/ssl/key.pem
    ports:
      - "80:80"
      - "443:443"
    restart: always
    depends_on:
      - frontend
    networks:
      - joptim

  backend:
    build:
      context: backend
      dockerfile: backend.Dockerfile
    image: joptim-backend
    restart: always
    depends_on:
      - db
    entrypoint:
      [
        "bash",
        "-c",
        "alembic upgrade head && gunicorn main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000",
      ]
    networks:
      - joptim

  frontend:
    build:
      context: frontend
      dockerfile: frontend.Dockerfile
    image: joptim-frontend
    restart: always
    networks:
      - joptim

  db:
    build:
      context: database
      dockerfile: db.Dockerfile
    image: joptim-db
    hostname: joptim-db
    restart: always
    volumes:
      - ./database/db:/var/lib/postgresql/data
    networks:
      - joptim

networks:
  joptim:

volumes:
  db:
